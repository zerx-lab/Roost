# roost-agent: the relay node. Copy to /etc/roost/agent.toml (mode 600).
# Secrets accept a literal, "env:NAME" or "file:/path" (relative to this file).
# Changes here take a restart (the plugin's "重启中继" button, or systemctl restart).

[server]
listen = "0.0.0.0:8787"
# Public base URL GitHub can reach (behind a TLS proxy). Required for the GitHub App: GitHub
# redirects back to <public_url>/github/app/callback and delivers webhooks to <public_url>/hooks/github.
public_url = "https://roost.example.com"
# max_body_bytes = 26214400

[auth]
# Bearer token the plugin sends. At least 16 characters: `openssl rand -hex 24`.
token = "env:ROOST_TOKEN"

[github]
# The agent runs as a GitHub App, created from the Roost relay page (「创建 GitHub App」): GitHub
# shows the read-only App for confirmation, then you pick the repositories to install it on.
# Its id, private key and webhook secret are kept in <data>/github-app.json (mode 600).
# api_url = "https://api.github.com"     # GitHub Enterprise: https://HOST/api/v3
# web_url = "https://github.com"         # GitHub Enterprise: https://HOST
# app = "/var/lib/roost/github-app.json" # where the App credentials live

[store]
# keep_events = 2000
# max_age = "7d"
# max_payload_bytes = 2097152            # larger payloads are relayed as info only
# max_total_bytes = 268435456

[paths]
# Relative to this file.
data = "/var/lib/roost"
subscriptions = "subscriptions.toml"
